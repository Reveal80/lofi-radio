# Apache como proxy inverso delante del panel Flask (servicio "python")
<VirtualHost *:80>
    ServerName localhost

    # Sin límite en Apache: el tope de 1 GB por subida lo pone Flask (MAX_CONTENT_LENGTH)
    LimitRequestBody 0
    ProxyTimeout 900

    ProxyPreserveHost On
    # directo en HLS desde MediaMTX para el reproductor del panel
    ProxyPass        /live/ http://mediamtx:8888/
    ProxyPassReverse /live/ http://mediamtx:8888/
    ProxyPass        / http://python:8750/
    ProxyPassReverse / http://python:8750/

    # httpd:2.4 escribe los registros en la salida del contenedor (docker logs)
    ErrorLog /proc/self/fd/2
    # no se registran los sondeos del panel (uno cada 3 s) ni los trozos del directo
    SetEnvIf Request_URI "^/(api/(state|logs)|live/)" sondeo
    CustomLog /proc/self/fd/1 combined env=!sondeo
</VirtualHost>
