# Radio Lofi 24/7 — arranque con la imagen publicada en Docker Hub.
# Un solo archivo: no hace falta descargar nada más.
#
#   mkdir radio-lofi && cd radio-lofi
#   docker compose -f docker-compose.imagen.yml up -d
#
# Panel: http://IP:8080   ·   VLC: rtsp://IP:8554/radio
# Variables opcionales: HTTP_PORT (8080) y PREVIEW_PORT (8554).
# Música, videos y la clave de YouTube quedan en ./data; los registros en ./logs.

services:
  python:
    image: therliss/lofi-radio:latest
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "1" }
    volumes:
      - ./data:/app/data   # música, videos y config.json (clave de YouTube)
      - ./logs:/app/logs   # registros de la emisión
    # environment:
    #   AUTOR: "Tu nombre"   # opcional: artista con el que se guardan las canciones subidas (si no, el del archivo)
    # GPU integrada (opcional): quita el «#» de las tres líneas siguientes para ceder la gráfica del
    # servidor al contenedor (Intel/AMD por VAAPI). Solo si existe /dev/dri/renderD128 en el servidor;
    # si no, el contenedor no arrancaría.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add: ["video", "render"]
    depends_on:
      - mediamtx
    expose:
      - "8750"
    restart: unless-stopped

  mediamtx:
    # servidor de streaming de la red local (VLC por RTSP, HLS para el panel)
    image: bluenviron/mediamtx:1.9.3
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "1" }
    environment:
      MTX_HLSVARIANT: fmp4
      MTX_HLSALWAYSREMUX: "yes"
      MTX_HLSSEGMENTDURATION: 1s
    ports:
      - "${PREVIEW_PORT:-8554}:8554"
    restart: unless-stopped

  apache:
    # proxy inverso: panel en / y directo HLS en /live/
    image: httpd:2.4
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "1" }
    depends_on:
      - python
    ports:
      - "${HTTP_PORT:-8080}:80"
    configs:
      - source: radio_conf
        target: /usr/local/apache2/conf/extra/radio.conf
    command: ["httpd-foreground", "-c", "ServerName localhost", "-c", "LoadModule proxy_module modules/mod_proxy.so", "-c", "LoadModule proxy_http_module modules/mod_proxy_http.so", "-c", "Include conf/extra/radio.conf"]
    restart: unless-stopped

configs:
  radio_conf:
    content: |
      <VirtualHost *:80>
          ServerName localhost
          LimitRequestBody 0
          ProxyTimeout 900
          ProxyPreserveHost On
          ProxyPass        /live/ http://mediamtx:8888/
          ProxyPassReverse /live/ http://mediamtx:8888/
          ProxyPass        / http://python:8750/
          ProxyPassReverse / http://python:8750/
          ErrorLog /proc/self/fd/2
          SetEnvIf Request_URI "^/(api/(state|logs)|live/)" sondeo
          CustomLog /proc/self/fd/1 combined env=!sondeo
      </VirtualHost>
